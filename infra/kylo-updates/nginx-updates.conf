# Kylo élő frissítés — statikus kiszolgálás (Cloudflare proxy mögött, HTTPS a Cloudflare-en)
server {
    listen 80;
    server_name updates.kylo.study;

    location /kylo/ {
        alias /var/www/updates/kylo/;
        limit_except GET HEAD { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET" always;
        autoindex off;

        location = /kylo/manifest.json {
            alias /var/www/updates/kylo/manifest.json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location /kylo/bundles/ {
            alias /var/www/updates/kylo/bundles/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }

    location / { return 404; }
}
